# This is the server configuration file. Here you can set up the connection for your server.
# Usually you have to change the ExternalHostname option to
# - 127.0.0.1 (if you want to play alone / testing purpose)
# - LAN IP* (if you want to play from another computer in the network)
# - WAN IP** (if you want to play with friends over internet)
# - Questions? => https://l2jlisvus.forumotion.com
#
# * = If you want to get your LAN IP, simply choose "Start" => "Run..." then type "cmd" => "ipconfig"
# **= If you want to get your WAN IP, visit http://www.whatismyip.com
# ===================================================================================================

# ================================================================
# General server setting !!! REQUIRED to configure to everyone !!!
# ================================================================

# Enables automatic port mapping for login server.
# If you have a router, login server will request for port forwarding.
# Default: False
EnableUPnP = False

# Bind ip of the loginserver, use * to bind on all available IPs
LoginserverHostname=*
LoginserverPort=2106

# Enables the native WebSocket listener for browser clients
# Browser connections are handed to the regular listener with their real address
# Default: False
LoginserverWebSocketEnabled = False
LoginserverWebSocketPort=3106

# Comma separated list of allowed WebSocket Origin headers, e.g. https://example.com
# Use it to only accept clients served from specific pages
# * accepts any origin, including clients that send no Origin header
# Default: *
WebSocketAllowedOrigins=*

# Comma separated list of proxy addresses or CIDR ranges in front of the WebSocket listener, e.g. 127.0.0.1,10.0.0.0/8
# Connections from these are attributed to the address in WebSocketRealIpHeader, so per IP limits and bans apply to the player and not the proxy
# Connections from them without a valid header are refused, connections from any other address use their own address and ignore the header
# Behind Cloudflare list its published ranges (https://www.cloudflare.com/ips/), behind cloudflared list the tunnel's address
# Default: empty
WebSocketTrustedProxies=

# Header the trusted proxies put the browser address in, e.g. X-Forwarded-For (its last entry is used) or X-Real-IP
# Default: CF-Connecting-IP
WebSocketRealIpHeader=CF-Connecting-IP

# The address on which login will listen for GameServers, use * to bind on all available IPs
LoginHostname=*

# The port on which login will listen for GameServers
LoginPort=9014

# How many times you can provide an invalid account/pass before the IP gets banned
LoginTryBeforeBan=10
# Time you won't be able to login back again after LoginTryBeforeBan tries to login. Provide a value in seconds.
# Default 10min. (600)
LoginBlockAfterBan=600

# Maximum concurrent client connections per IP, WebSocket clients included. 0 disables the limit
# Clients that do not log in within 60 seconds are disconnected
# Default: 10
LoginMaxConnectionsPerIp=10

# If set to true any GameServer can register on your login's free slots
AcceptNewGameServer = True

# Comma separated list of IP addresses or hostnames allowed to connect as a GameServer
# Empty allows any address
# Default: empty
GameServerAllowedAddresses=

# If false, the licence (after the login) will not be shown
# It is highly recommended for Account Security to leave this option as default (True)
ShowLicence = True

# Database info
Driver=org.mariadb.jdbc.Driver
#Driver=com.mysql.jdbc.Driver
#Driver=org.hsqldb.jdbcDriver
#Driver=com.microsoft.sqlserver.jdbc.SQLServerDriver
URL=jdbc:mariadb://localhost/l2jdb?useSSL=false
#URL=jdbc:mysql://localhost/l2jdb?useSSL=false
#URL=jdbc:hsqldb:hsql://localhost/l2jdb
#URL=jdbc:sqlserver://localhost/database=l2jdb/user=root/password=
Login=root
Password=

# Maximum number of connections for combo pool to handle.
# Note: If number is too high, it might exceed MySQL 'max_connections' property 
# and prevent more clients (e.g. management tools) to connect.
# Default: 5
MaximumDbConnections = 5
# Maximum idle time (in milliseconds)
MaximumDbIdleTime = 0

# Usable values: "true" - "false", use this option to choose whether accounts will be created
# automatically or not.
AutoCreateAccounts=True

# Enforce gameguard for clients
GameGuardEnforce = False
# Accept 'Chaotic Throne' clients.
# Note: So far, this has only been tested with IL.
AcceptChaoticThroneClients = False

# Datapack root directory.
# Defaults to current directory from which the server is started.
DatapackRoot = .

# ==============================================================
# Test server setting, shouldn't be touched in online game server
# ==============================================================

Debug = False
PacketHandlerDebug = False
Assert = False
Developer = False

#FloodProtection. time in ms
EnableFloodProtection=True
FastConnectionLimit=15
NormalConnectionTime=700
FastConnectionTime=350
MaxConnectionPerIP=50

# Specific logging for login attempts
LogLoginAttempts = False