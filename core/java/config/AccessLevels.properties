#===========================================================#
#						Access Levels						#
#===========================================================#

# This is the configurable highest access level. The same setting is used to
# set access level for characters when everyone has admin rights in server.
# This is also used as the default access level for all admin commands
# but is overridden by access levels set in admin command rights file.
MasterAccessLevel = 100

# Cap the required access level for gameplay and character-management commands,
# including commands without an XML entry. Lower XML requirements stay lower.
# Set to -1 to use the original per-command XML permissions instead.
GMCommandAccessLevel = -1

# Minimum access level for the server controls listed below when the override
# above is enabled. This includes script loading and changing GM access levels.
ServerControlAccessLevel = 100

# Comma-separated command names requiring ServerControlAccessLevel.
# Keep access-level changes here so gameplay GMs cannot promote themselves.
# Apply changes with //reload config or restart the game server.
ServerControlCommands = admin_server_shutdown,admin_server_restart,admin_server_abort,\
    admin_server_gm_only,admin_server_all,admin_server_max_player,admin_server_list_clock,\
    admin_server_login,admin_changelvl,admin_reload,admin_reload_announcements,\
    admin_reload_autoannounce,admin_cache_htm_rebuild,admin_cache_htm_reload,\
    admin_cache_crest_fix,admin_cache_crest_rebuild,admin_cache_crest_reload,\
    admin_cache_reload_file,admin_cache_reload_path,admin_quest_reload,\
    admin_teleport_reload,admin_spawn_reload,admin_script_load,admin_closeall,admin_openall,\
    admin_respawnall,admin_unspawnall,admin_para_all,admin_unpara_all,admin_saveolymp,\
    admin_endolympiad,admin_ge_mode,admin_ge_join,admin_ge_leave,admin_zone_reload,\
    admin_forge,admin_forge2,admin_forge3,admin_kick_non_gm

# GM Access Levels
GMResurrectFixed = 100
GMPeaceAttack = 100
GMTransaction = 100

# Disable those by default, since admins get confused.
GMItemRestriction = 1000
GMSkillRestriction = 1000
